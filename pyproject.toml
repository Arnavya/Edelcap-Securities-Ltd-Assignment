[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finflow-reasoning-engine"
version = "0.1.0"
description = "FinFlow Expert-Learning Organizational Reasoning Engine (intern project INT-AI-01)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["finflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
